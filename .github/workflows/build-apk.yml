name: Build Android APK

on:
  # Hemos eliminado la sección 'push' para que no se compile solo.
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'pnpm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Init EAS Project
        run: eas init --account smbbol88s-team --non-interactive

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
